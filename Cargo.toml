[package]
name = "tabpak"
description = "Songsterr tab to a feedpak song for quickRS"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
# The window. quickRS's look library and fastframe both build on egui 0.36.2.
eframe = { version = "0.36.2", features = ["wgpu"] }
egui = "0.36.2"
# quickRS's own look: its themes, fonts, keys, wells and icons.
qrs-ui = { git = "https://github.com/arpan2711/quickRS-player", tag = "v0.5.6" }
# Desktop plumbing shared with Spotifast and ZapFast: per-user folders, files replaced in one step, Metal first.
fastframe-dirs = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
fastframe-file = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1" }
fastframe-graphics = { git = "https://github.com/crmne/fastframe", tag = "v0.17.1", features = ["wgpu"] }

serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Audio in: AAC from YouTube, Opus from Songsterr, and whatever file the player brings.
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "mp3", "flac", "wav", "pcm", "vorbis", "ogg"] }
symphonia-opus = "0.1.3"
# Audio out: Ogg Vorbis, the format every feedpak reader plays.
vorbis_rs = "0.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = { version = "0.15", default-features = false }
arboard = { version = "3", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# On Linux the file picker needs a backend named: the desktop portal.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[dev-dependencies]
egui_kittest = { version = "0.36", features = ["wgpu", "snapshot"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[profile.dev.package."*"]
opt-level = 2
